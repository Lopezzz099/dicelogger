version: "3.8"

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dicelogger
      MYSQL_USER: dicelogger
      MYSQL_PASSWORD: dicelogger
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: dicelogger
      DB_PASSWORD: dicelogger
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dicelogger
      PORT: 8080
    ports:
      - "8080:8080"
    # serviceAccountKey.json no se versiona: montalo local para probar Firebase.
    # volumes:
    #   - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  mysql_data:
