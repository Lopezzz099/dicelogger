version: "3.8"

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dicelogger
      MYSQL_USER: dicelogger
      MYSQL_PASSWORD: dicelogger
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: dicelogger
      DB_PASSWORD: dicelogger
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dicelogger
      PORT: 8080
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      FIREBASE_CREDENTIALS_FILE: /app/serviceAccountKey.json
      EMAIL_SENDER: ${EMAIL_SENDER}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
    ports:
      - "8080:8080"
    # serviceAccountKey.json no se versiona: dejalo en backend/ para que
    # este volume lo monte automáticamente.
    volumes:
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080/api/v1
      API_KEY: ${API_KEY}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  mysql_data:
